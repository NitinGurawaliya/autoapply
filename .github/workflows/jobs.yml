# Finding companies and reading their jobs on a schedule, whether or not a worker is up (M21, docs/boards/TASKS.md#m21).
# The worker with a screen keeps only applying; run it with INGEST_MODE=off, DISCOVER_CRON=off and BOARD_DAY_CRON=off
# once these runs pass (docs/DEPLOY.md, "Scheduled jobs on GitHub Actions").
#
# Scheduled workflows run from the default branch only: these schedules start once this file is on main.
# Repository secrets needed: DATABASE_URL, DIRECT_URL, OPENAI_API_KEY; for new-match pushes also VAPID_PUBLIC_KEY,
# VAPID_PRIVATE_KEY, VAPID_SUBJECT and APP_URL (pushes are skipped while the VAPID keys are unset).
name: Discovery and ingest

on:
  schedule:
    - cron: "30 1 * * *" # discovery, daily (as DEFAULT_DISCOVER_CRON)
    # ingest, every hour at :47. Each run reads only companies already due (modules/jobs/cadence.ts), so more triggers do
    # not mean more reads; they make GitHub's dropped and late schedules cheap. On 18-19 Nov "15 */3 * * *" got a run
    # for 2 of 7 slots and discovery and the board day started 5-8 hours late (GitHub drops scheduled runs under load,
    # most near the top of the hour).
    - cron: "47 * * * *"
    - cron: "30 23 * * *" # board day, the UTC day's numbers per board (as DEFAULT_BOARD_DAY_CRON)
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [ingest, discovery, board-day]
        default: ingest
      boards:
        description: "Discovery only: boards, comma-separated (empty: every board)"
        type: string
        default: ""
      limit:
        description: "Ingest only: at most this many due companies"
        type: string
        default: "6000"

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  # 21 Nov: the text calls' provider (lib/llm.ts). Set the repository variable LLM_PROVIDER to "gemini" (with the secret
  # GEMINI_API_KEY) to move them to Gemini; unset keeps OpenAI. Embeddings stay on OpenAI. The web app must match.
  LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
  VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
  VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
  # Phase P, P3: the one gate (title AND reading) in every feed these jobs build (warm, prescan); every process must carry
  # the same value (docs/relevance/TDD.md 4.9). "0" turns the reading part off.
  READING_GATE: "1"
  # 20 Nov: the quality floor (match.ts applyFeedFloor) in every feed these jobs build; the same value on every process.
  FEED_FLOOR: "65"
  # Phase P, P7: the daily set (warm builds it; after-ingest sends its one morning push). "1" on, anything else off; the
  # web app and the worker must carry the same value. On since 20 Nov (owner).
  DAILY_SET: "1"
  # Phase P, P6: the fit verdict (fit.ts, FitJudgement) in place of the old judge when "1", on gpt-4.1 (FIT_MODEL, the
  # fit calls only). On since 20 Nov: the owner chose it with gpt-4.1's numbers (TDD 7.1); the web app and the worker
  # carry the same two values (4.9).
  RELEVANCE_FIT: "1"
  FIT_MODEL: "gpt-4.1"
  APP_URL: ${{ secrets.APP_URL }}

jobs:
  discovery:
    name: Discovery (${{ matrix.board }})
    if: github.event.schedule == '30 1 * * *' || (github.event_name == 'workflow_dispatch' && inputs.task == 'discovery')
    runs-on: ubuntu-latest
    # Each board its own job, as the worker's discover queue does (handlers/discover.ts): Greenhouse alone took 52 minutes
    # on 2 Nov, so one job for every board would run past its time and leave the later boards out.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        board: [greenhouse, lever, ashby, workday, zohorecruit, keka, smartrecruiters, workable]
    timeout-minutes: 150
    concurrency:
      group: discovery-${{ matrix.board }}
      cancel-in-progress: false
    steps:
      - name: Skip boards not asked for
        id: wanted
        shell: bash
        # Inputs reach the shell as variables, never pasted into the script (no injection through an input).
        env:
          BOARDS: ${{ inputs.boards }}
          BOARD: ${{ matrix.board }}
        run: |
          boards="${BOARDS// /}"
          if [ -z "$boards" ] || [[ ",$boards," == *",$BOARD,"* ]]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.wanted.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.wanted.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.wanted.outputs.run == 'true'
      - run: npx tsx scripts/discover-now.ts --boards ${{ matrix.board }}
        if: steps.wanted.outputs.run == 'true'

  ingest:
    name: Ingest (companies due)
    if: github.event.schedule == '47 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.task == 'ingest')
    runs-on: ubuntu-latest
    # ~30,800 companies at their tiers' pace need ~39,000 reads a day (18 Nov): a run of up to 6,000 an hour covers that
    # with room for the runs GitHub drops.
    timeout-minutes: 120
    # A run still going when the next is due: the next waits, so two never read the same companies at once (a third
    # arriving while one waits replaces it; GitHub shows the replaced one as cancelled).
    concurrency:
      group: ingest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only companies whose next read is due (modules/jobs/cadence.ts), most overdue first; then looks for missing logos.
      - shell: bash
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          limit="${LIMIT:-6000}"
          [[ "$limit" =~ ^[0-9]+$ ]] || { echo "limit must be a number"; exit 1; }
          npx tsx scripts/ingest-tick-now.ts --limit "$limit"

  after-ingest:
    name: After ingest (embed, label, read, warm)
    # Its own job (Phase P, docs/relevance/TDD.md 4.1.1), so the company read's 2 hours never starve it; it runs even when
    # the read failed or ran out of time, for what that read did write.
    needs: ingest
    if: ${{ always() && (github.event.schedule == '47 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.task == 'ingest')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: after-ingest
      cancel-in-progress: false
    env:
      JOB_READINGS_PER_DAY: "4000"
      AFTER_INGEST_RUN_MS: "2400000"
      LLM_BACKGROUND_CONCURRENT: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Embeds new jobs, labels the pool's skills, reads pool jobs until the day's budget or 40 minutes, warms the feeds
      # (new-match pushes), deletes old closed jobs.
      - run: npx tsx scripts/after-ingest-now.ts

  board-day:
    name: Board day
    if: github.event.schedule == '30 23 * * *' || (github.event_name == 'workflow_dispatch' && inputs.task == 'board-day')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/board-day.ts
